# Training Configuration for Turkish Food Classifier

# Model settings
model:
  backbone: "efficientnet_b0"  # Options: resnet18, resnet34, efficientnet_b0
  pretrained: true
  num_classes: null  # Will be auto-detected from dataset

# Data settings
data:
  data_dir: "data"
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true

# Training settings
training:
  epochs: 30
  base_lr: 0.0005          # Learning rate for backbone after unfreezing
  head_lr: 0.001           # Learning rate for classification head
  weight_decay: 0.0001
  optimizer: "adam"        # Options: adam, adamw, sgd
  scheduler: "step"        # Options: step, cosine, plateau
  step_size: 10
  gamma: 0.1
  early_stopping_patience: 5
  save_best_only: true
  label_smoothing: 0.1     # Label smoothing for better generalization
  freeze_backbone_epochs: 3  # Train only head for first N epochs

# Augmentation settings
augmentation:
  train:
    # Stronger augmentation for better regularization
    resize_size: 256       # Resize before crop
    random_horizontal_flip: 0.5
    random_rotation: 15
    color_jitter:
      brightness: 0.3      # Increased from 0.2
      contrast: 0.3        # Increased from 0.2
      saturation: 0.3      # Increased from 0.2
      hue: 0.1
    random_resized_crop:
      enabled: true
      scale_min: 0.8
      scale_max: 1.0
  val:
    # Simple center crop for validation
    resize_size: 256
    center_crop: true

# Paths
paths:
  checkpoint_dir: "checkpoints"
  output_dir: "outputs"
  model_name: "turkish_food_classifier"

# Reproducibility
seed: 42

